# Compose overlay shipped by Phase 26-02. Brings up the self-hosted GlitchTip
# stack (Sentry-wire-compatible) reusing the existing FinTrack Postgres and
# Redis containers. Run with:
#   docker compose -f docker-compose.yml -f monitoring/glitchtip/docker-compose.glitchtip.yml up -d
# The main docker-compose.yml is intentionally NOT modified by this phase
# (the project's pre_guard_release_files.py hook blocks Write/Edit on it).

services:
  postgres:
    # Merge-only: append the GlitchTip init script to the existing volumes
    # list. Postgres runs files in /docker-entrypoint-initdb.d/ alphabetically
    # on a fresh data volume; the 10- prefix sequences this after any existing
    # init scripts. On an EXISTING data volume this mount is a no-op -- the
    # operator runs init-db.sql by hand per docs/OPERATIONS.md.
    volumes:
      - ./monitoring/glitchtip/init-db.sql:/docker-entrypoint-initdb.d/10-glitchtip.sql:ro

  glitchtip-web:
    image: glitchtip/glitchtip:v4.1
    container_name: fintrack-glitchtip-web
    restart: always
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip-change-me}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-change-me-32-bytes-of-random-data-please}
      - REDIS_URL=redis://:${SPRING_REDIS_PASSWORD:-}@redis:6379/1
      - PORT=8000
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@fintrack.local}
      - CELERY_WORKER_AUTOSCALE=${GLITCHTIP_CELERY_AUTOSCALE:-1,3}
      - ENABLE_USER_REGISTRATION=false
      - ENABLE_OPEN_USER_REGISTRATION=false
    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fintrack-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/api/0/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1
    container_name: fintrack-glitchtip-worker
    restart: always
    command: ./bin/run-celery-with-beat.sh
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip-change-me}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-change-me-32-bytes-of-random-data-please}
      - REDIS_URL=redis://:${SPRING_REDIS_PASSWORD:-}@redis:6379/1
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@fintrack.local}
      - CELERY_WORKER_AUTOSCALE=${GLITCHTIP_CELERY_AUTOSCALE:-1,3}
    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fintrack-net

volumes:
  glitchtip-uploads:

networks:
  fintrack-net:
    external: true
