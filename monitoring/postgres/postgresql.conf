# Phase 30-02 / Track F2 -- operator-only postgres config that loads
# pg_stat_statements for ad-hoc EXPLAIN walks. Mounted by
# docker-compose.postgres.yml; the live docker-compose.yml does NOT
# reference this file. See docs/OPERATIONS.md
# "Inspecting slow queries with pg_stat_statements" for the runbook.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on
