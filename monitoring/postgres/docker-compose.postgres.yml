# Compose overlay shipped by Phase 30-02. Loads pg_stat_statements into
# the postgres container so the operator can run EXPLAIN walks against
# the running database. Bring up Postgres with the overlay using:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f monitoring/postgres/docker-compose.postgres.yml \
#     up -d postgres
#
# Then connect with psql and run:
#
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
#
# See docs/OPERATIONS.md "Inspecting slow queries with pg_stat_statements".
#
# The main docker-compose.yml is intentionally NOT modified by this phase --
# Claude tooling is denied write access via the project's
# pre_guard_release_files.py PreToolUse hook. The live deployment does
# NOT load pg_stat_statements; this overlay is operator-only.

services:
  postgres:
    # Compose merges service-level dictionary keys but REPLACES list-typed
    # keys, so the original main-compose volume mounts must be repeated
    # here in addition to the new postgresql.conf mount. The image,
    # environment, ports, networks, and healthcheck inherit from the main
    # compose unchanged.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./monitoring/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

volumes:
  postgres-data:
